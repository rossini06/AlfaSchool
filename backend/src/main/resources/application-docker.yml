spring:
  datasource:
    # serverTimezone DEVE bater com o fuso real do MySQL (o container roda em
    # UTC). Quando divergia (America/Sao_Paulo), as leituras JDBC cruas das
    # colunas DATETIME(6) zoneless deslocavam ~+3h por hop e a permanencia/portal
    # calculava tempo NEGATIVO (entrada aparecia "no futuro").
    url: jdbc:mysql://mysql:3306/alfaschool?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_ROOT_PASSWORD:alfaschool123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379

app:
  cors:
    # Precisa listar a PORTA de cada origem de desenvolvimento. Faltando,
    # o navegador recebe 403 do CORS e a tela de login mostra "verifique
    # suas credenciais" — mensagem enganosa, porque a senha esta certa e a
    # requisicao nem chegou no login (failed_attempts continua zero).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8083,http://localhost:8085,http://127.0.0.1:5173,http://127.0.0.1:8085}
