spring:
  application:
    name: alfaschool-backend
  profiles:
    active: ${APP_PROFILE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/alfaschool?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # validate, nao none. O Hibernate confere no boot se cada entidade
      # tem no banco as colunas que ela mapeia, e recusa subir se nao tem.
      #
      # Com 'none' ele nao conferia nada, e o resultado foi um defeito que
      # sobreviveu meses: HistoricoNota mapeava created_at/updated_at/
      # deleted (herdados de BaseEntity) que a tabela nao possuia. Todo
      # INSERT falhava, o NotaService engolia a excecao num catch que so'
      # logava WARN, e o historico de alteracao de nota ficou com ZERO
      # linha — justamente o registro que a escola precisa quando um
      # responsavel contesta uma nota.
      #
      # Os testes nao pegavam: eles usam create-drop, que gera a tabela a
      # partir da entidade, entao ela sempre bate. So' o schema do Flyway
      # divergia, isto e', desenvolvimento e producao.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:12345678901234567890123456789012345678901234567890}
    jwt-expiration-minutes: ${APP_JWT_EXP_MINUTES:480}
    refresh-expiration-minutes: ${APP_JWT_REFRESH_EXP_MINUTES:10080}
  admin:
    email: ${APP_SUPERADMIN_EMAIL:superadmin@alfaschool.com}
    name: ${APP_SUPERADMIN_NAME:Super Admin}
    password: ${APP_SUPERADMIN_PASSWORD:100%Alfa@}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
  # Chave de cifra de segredos operacionais (senha de equipamento Control iD,
  # credencial de provedor de WhatsApp). Minimo 32 caracteres. TROCAR EM
  # PRODUCAO: o valor abaixo e' so' para laboratorio.
  secret-key: ${APP_SECRET_KEY:alfaschool-dev-secret-key-trocar-em-producao-32+}

  # Os valores padrao acima sao de laboratorio e estao no repositorio. O
  # SegredosDeBootGuard recusa o boot enquanto estiverem em uso, a menos
  # que esta chave seja ligada de proposito. Ver a classe para o porque.
  permitir-segredos-padrao: ${APP_PERMITIR_SEGREDOS_PADRAO:false}

  access:
    # Fuso dos equipamentos. O firmware Control iD reporta epoch calculado
    # no horario local, nao em UTC — a conversao depende disto.
    device-timezone: ${ACCESS_DEVICE_TZ:America/Sao_Paulo}
    # Janela de deduplicacao de evento repetido do mesmo leitor. Absorve o
    # toque duplo no leitor, que viraria um par entrada/saida falso.
    dedup-window-seconds: ${ACCESS_DEDUP_WINDOW:60}
    # Sem heartbeat por este tempo, o equipamento passa a offline. Sem isto
    # um agente morto deixa o leitor marcado online para sempre.
    heartbeat-timeout-seconds: ${ACCESS_HEARTBEAT_TIMEOUT:180}
    # Simulador de leitor Control iD para laboratorio, sem hardware.
    # NUNCA habilitar em producao: ele expoe endpoints .fcgi publicos que
    # imitam o firmware e aceitam comando sem autenticar.
    simulador-habilitado: ${ACCESS_SIMULADOR:false}
    # Backend do FotoStorage: "local" (disco, padrao) ou "minio" (object
    # storage, para mais de uma replica de backend). So' um bean e' criado.
    storage: ${ACCESS_STORAGE:local}
    minio:
      endpoint: ${ACCESS_MINIO_ENDPOINT:http://minio:9000}
      access-key: ${ACCESS_MINIO_ACCESS_KEY:}
      secret-key: ${ACCESS_MINIO_SECRET_KEY:}
      bucket: ${ACCESS_MINIO_BUCKET:alfaschool-fotos}
    # Fotos de referencia enviadas aos leitores. Usado pelo storage local.
    foto-dir: ${ACCESS_FOTO_DIR:/tmp/alfaschool-fotos}
    foto-max-bytes: ${ACCESS_FOTO_MAX_BYTES:2097152}
    controlid:
      # Um leitor mudo nao pode travar o ciclo inteiro: timeouts explicitos.
      connect-timeout-ms: ${CONTROLID_CONNECT_TIMEOUT:3000}
      read-timeout-ms: ${CONTROLID_READ_TIMEOUT:8000}
      # Sessao do firmware e' cacheada por equipamento; sem isso um full sync
      # de 2000 alunos faria 2000 logins no leitor.
      sessao-ttl-seconds: ${CONTROLID_SESSAO_TTL:240}
    heartbeat-check-ms: ${ACCESS_HEARTBEAT_CHECK:30000}

logging:
  level:
    br.com.alfaschool: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
management:
  endpoint:
    health:
      show-details: never
