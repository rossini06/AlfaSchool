<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      Preload da marca: os <img> só nascem depois que o React monta, então sem
      isto as imagens começam a baixar ~150ms depois do primeiro paint e a logo
      "pisca" ao aparecer (visível no login). Com o preload elas descem em
      paralelo com o bundle e já estão prontas na montagem.
    -->
    <link rel="preload" as="image" href="/alfaschool-icon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/alfaschool-logo.png" type="image/png" />
    <!--
      Preload da fonte: sem isto o navegador so' descobre a Inter quando o
      CSS do bundle chega e e' lido, e o texto do login troca de fonte na
      frente da pessoa. `crossorigin` e' obrigatorio para fonte, mesmo no
      mesmo dominio — sem ele o navegador baixa o arquivo duas vezes.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable-latin.woff2" crossorigin />
    <!-- Teal da família Alfa. É a cor da marca, não a do botão: o botão usa
         o tom clareado que passa no contraste (ver --color-brand). -->
    <meta name="theme-color" content="#029CAF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlfaSchool - Plataforma SaaS de Gestão Escolar" />
    <title>AlfaSchool - Gestão Escolar</title>
    <style>
      /* Prevent flash of unstyled content */
      html { background-color: #0f1117; }
    </style>
    <script>
      // Apply saved theme before React loads to prevent flash
      (function() {
        var t = localStorage.getItem('alfaschool-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'light' ? '#f5f7fa' : '#0f1117';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
