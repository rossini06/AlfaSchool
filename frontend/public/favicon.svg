<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AlfaSchool">
  <!--
    Marca do AlfaSchool: um portao aberto com a silhueta de um aluno
    passando. O modulo que da' identidade ao produto e' o controle de
    acesso, e e' isso que a aba do navegador deve dizer.

    Antes aqui estava o /vite.svg — o sistema se apresentava com a marca do
    empacotador que o compila.
  -->
  <rect width="32" height="32" rx="7" fill="#1696a3"/>
  <!-- batentes do portao -->
  <path d="M7 8v16M25 8v16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
  <!-- aluno atravessando -->
  <circle cx="16" cy="12" r="3.1" fill="#ffffff"/>
  <path d="M10.4 25c0-3.4 2.5-6 5.6-6s5.6 2.6 5.6 6" fill="#ffffff"/>
</svg>
