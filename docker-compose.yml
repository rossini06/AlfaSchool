version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: alfaschool-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alfaschool123}
      MYSQL_DATABASE: alfaschool
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alfaschool-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-alfaschool123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: alfaschool-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alfaschool123}
      UPLOAD_LIMIT: 50M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - alfaschool-network

  redis:
    image: redis:7-alpine
    container_name: alfaschool-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alfaschool-network

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: alfaschool-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alfaschool123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-12345678901234567890123456789012345678901234567890}
      APP_SUPERADMIN_EMAIL: ${APP_SUPERADMIN_EMAIL:-superadmin@alfaschool.com}
      APP_SUPERADMIN_NAME: ${APP_SUPERADMIN_NAME:-Super Admin}
      APP_SUPERADMIN_PASSWORD: ${APP_SUPERADMIN_PASSWORD:-100%Alfa@}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - alfaschool-network

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: alfaschool-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - alfaschool-network

  nginx:
    image: nginx:1.27-alpine
    container_name: alfaschool-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.development.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - alfaschool-network

networks:
  alfaschool-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
