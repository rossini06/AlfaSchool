# =====================================================================
# Staging: UMA porta so' (80). O Tailscale Funnel termina o TLS (HTTPS 443
# -> http://localhost:80), entao aqui e' HTTP puro. Serve o build da SPA e
# proxeia /api, /actuator e os streams SSE para o backend (alias de rede
# "backend" no docker-compose.staging.yml).
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        # $http_host preserva host+porta para o backend deduzir a origem certa.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
    }

    # Os paineis das TVs usam SSE: sem desligar o buffer, o nginx segura os
    # eventos e a tela so' atualiza quando o buffer enche.
    location ~ ^/api/v1/access/paineis/.+/stream$ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
