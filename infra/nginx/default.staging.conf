# =====================================================================
# Staging: UMA porta so' (80). O Tailscale Funnel termina o TLS (HTTPS 443
# -> http://localhost:80), entao aqui e' HTTP puro.
#
# Serve TRES coisas na mesma porta:
#   - a LANDING de marketing na raiz EXATA "/" e nas paginas legais;
#   - o app React (SPA) em todo o resto (/login, /dashboard, /saas, ...);
#   - proxy de /api, /actuator e dos streams SSE para o backend.
#
# A landing e' um site estatico separado do app (dir /usr/share/landing); o
# app vem do build do Vite (/usr/share/nginx/html). O botao "Entrar" da landing
# aponta para /login, que cai no catch-all e sobe o SPA.
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # SPA (build do Vite)
    index index.html;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- Backend ---------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        # $http_host preserva host+porta para o backend deduzir a origem certa.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
    }

    # Os paineis das TVs usam SSE: sem desligar o buffer, o nginx segura os
    # eventos e a tela so' atualiza quando o buffer enche.
    location ~ ^/api/v1/access/paineis/.+/stream$ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # ---- Landing (marketing) --------------------------------------------
    # Raiz EXATA "/" serve a landing; qualquer outra rota cai no SPA abaixo.
    location = / {
        root      /usr/share/landing;
        try_files /index.html =404;
    }
    location = /politica-de-privacidade {
        root      /usr/share/landing;
        try_files /politica-de-privacidade.html =404;
    }
    location = /termos-de-uso {
        root      /usr/share/landing;
        try_files /termos-de-uso.html =404;
    }
    # Assets da landing num prefixo proprio, para nao colidir com /assets/ do Vite.
    location /landing-assets/ {
        root       /usr/share/landing;
        access_log off;
        expires    7d;
    }

    # ---- App React (SPA): tudo que nao e' landing nem backend -----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
