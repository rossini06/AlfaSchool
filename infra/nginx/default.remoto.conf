# =====================================================================
# Modo remoto: UMA porta so'.
#
# Serve o build estatico do frontend e faz proxy de /api e /actuator para
# a API, na mesma origem. Existe porque o Vite em modo dev depende de um
# websocket de HMR que atravessa tunel SSH mal, e porque expor duas
# portas dobra a chance de o tunel estar incompleto — o sintoma e' a
# pagina carregar e o login morrer com "Failed to fetch".
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass         http://alfaschool-api-dev:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass         http://alfaschool-api-dev:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Os paineis das TVs usam SSE: sem desligar o buffer, o nginx segura
    # os eventos e a tela so' atualiza quando o buffer enche.
    location ~ ^/api/v1/access/paineis/.+/stream$ {
        proxy_pass         http://alfaschool-api-dev:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # SPA: qualquer rota desconhecida devolve o index, senao recarregar
    # em /access/coordenacao daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
