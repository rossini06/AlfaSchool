name: ci

# Testa o backend e publica as imagens no GHCR a cada push na main.
# O staging (deploy-staging no Proxmox) so' avanca quando a imagem
# sha-<commit> existe — a existencia da imagem E' a prova de CI verde.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  build-images:
    needs: test-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infra/docker/backend.Dockerfile
          - image: frontend
            dockerfile: infra/docker/frontend.staging.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          # Ambos os Dockerfiles copiam de backend/ e frontend/, entao o
          # contexto e' a RAIZ do repo.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/alfaschool-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/alfaschool-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
